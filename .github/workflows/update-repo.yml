name: Update F-Droid Repository & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [ app-released ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy F-Droid Catalog (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Android SDK Build Tools
        run: |
          LATEST_BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "$LATEST_BUILD_TOOLS" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "Using Android Build Tools: $LATEST_BUILD_TOOLS"

      - name: Install latest fdroidserver & OpenSSL dev
        run: |
          sudo add-apt-repository -y ppa:fdroid/fdroidserver
          sudo apt-get update
          sudo apt-get install -y fdroidserver apksigner pkg-config libssl-dev

      - name: Compile Rust Repository Builder
        run: cargo build --release

      - name: Patch Androguard & Build F-Droid Repository in Rust
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          APP_RELEASE_KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
          APP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          APP_RELEASE_KEY_ALIAS: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
        run: |
          sudo ./target/release/rust-repo-builder patch
          ./target/release/rust-repo-builder build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore(repo): deploy updated F-Droid repository via Rust builder"
