name: Update F-Droid Repository & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [ app-released ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build F-Droid Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver & apksigner
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver apksigner

      - name: Build F-Droid Repository & Web Portal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          APP_RELEASE_KEYSTORE_BASE64: ${{ secrets.APP_RELEASE_KEYSTORE_BASE64 }}
          APP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.APP_RELEASE_KEYSTORE_PASSWORD }}
          APP_RELEASE_KEY_ALIAS: ${{ secrets.APP_RELEASE_KEY_ALIAS }}
        run: |
          python scripts/build_repo.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
