[package]
name = "rust-repo-builder"
version = "2.0.0"
edition = "2021"
description = "High-performance, memory-safe F-Droid repository builder and Androguard patcher in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip", "json"] }
base64 = "0.22"
walkdir = "2.5"
