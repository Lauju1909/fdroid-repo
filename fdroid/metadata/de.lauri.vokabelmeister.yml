Name: VokabelMeister
AutoName: VokabelMeister
Summary: Barrierefreier schriftlicher Vokabeltrainer mit Fehlertoleranz für Android
Categories:
  - Education
License: MIT
AuthorName: Lauju1909
SourceCode: https://github.com/Lauju1909/VokabelMeister-Android
IssueTracker: https://github.com/Lauju1909/VokabelMeister-Android/issues
Description: |-
  VokabelMeister ist ein rein schriftlicher Vokabeltrainer für Android,
  speziell konzipiert für effektives aktives Schreiben und Wiederholen.

  Features:
  - 100% barrierefrei und für Screenreader (TalkBack) optimiert
  - Reine schriftliche Abfrage zum gezielten Einprägen der Rechtschreibung
  - Damerau-Levenshtein-Tippfehlertoleranz (verzeiht Dreher und kleine Tippfehler)
  - Intelligente Klammer- und Schrägstrich-Auflösung für Synonyme und Kurzformen
  - Gewichtetes Kartensystem für häufigere Wiederholung schwieriger Begriffe
  - Über 1.700 vorinstallierte Vokabeln (Sprachen, Fachwörter, Formeln, Befehle)
  - Vollständiger Datei-Import (.docx, .xlsx, .csv, .txt, .json)
  - Text-to-Speech (TTS) Ausspracheunterstützung
  - 100% Offline & Privat – keinerlei Tracking oder Datensammlung
