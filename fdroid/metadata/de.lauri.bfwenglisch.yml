AutoName: BFW Vokabel-Verwaltung
Summary: Zentrale Vokabel-Verwaltung fuer Wirtschaftsenglisch BFW 1 & BFW 2
Description: |-
  BFW Vokabel-Verwaltung ist eine barrierefreie Vokabel-Management-App fuer
  die Berufsfachschule Wirtschaft.

  Features:
  - 100% barrierefrei und fuer TalkBack/NVDA optimiert
  - Vollstaendige Verwaltung: Themen und Vokabeln erstellen, bearbeiten, loeschen
  - Alle offiziellen Themen aus BFW 1 & BFW 2 (334 Vokabeln vorinstalliert)
  - Universal-Import: Word (.docx), Excel (.xlsx), CSV, JSON und Text
  - 1-Klick-Export fuer VokabelStar und VokabelMeister
  - Echte englische Sprachausgabe (TTS) zum Anhoeren der Begriffe
  - 100% offline und lokal nutzbar

RepoType: git
Repo: https://github.com/Lauju1909/BFW-Wirtschaftsenglisch-Android.git

