Description: |-
  BFW Vokabel-Verwaltung ist eine barrierefreie Vokabel-Management-App für
  die Berufsfachschule Wirtschaft.

  Features:
  - 100% barrierefrei und für TalkBack/NVDA optimiert
  - Vollständige Verwaltung: Themen und Vokabeln erstellen, bearbeiten, löschen
  - Alle offiziellen Themen aus BFW 1 & BFW 2 (334 Vokabeln vorinstalliert)
  - Universal-Import: Word (.docx), Excel (.xlsx), CSV, JSON und Text
  - 1-Klick-Export für VokabelStar und VokabelMeister
  - Echte englische Sprachausgabe (TTS) zum Anhören der Begriffe
  - 100% offline und lokal nutzbar
