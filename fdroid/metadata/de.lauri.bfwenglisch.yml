Description: |-
  BFW Wirtschaftsenglisch ist ein barrierefreier Vokabel-Hub fuer die
  Berufsfachschule Wirtschaft.

  Features:
  - 100% barrierefrei und fuer TalkBack optimiert
  - Themen aus BFW 1 & BFW 2 (Berufsbilder, Kaufhaus, Abteilungen, Bewerbung, Handelskorrespondenz)
  - Vokabel-Export und 1-Klick-Download fuer VokabelStar und VokabelMeister
  - Vokabeln einzeln vorhoeren und lernen
  - 100% offline und lokal nutzbar

