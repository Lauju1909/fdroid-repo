AutoName: Schrittzähler Barrierefrei
Summary: Barrierefreier Schrittzähler mit TalkBack, Sprachausgabe & Perioden-Statistiken
Description: |-
  Schrittzähler Barrierefrei ist eine intuitive und vollständig barrierefreie Gesundheits- und Bewegungs-App,
  speziell entwickelt für blinde, sehbehinderte und motorisch eingeschränkte Menschen.

  Funktionen:
  - Optimiert für Screenreader (Google TalkBack)
  - Schüttel-Geste: Handy kurz schütteln liest den aktuellen Stand laut vor
  - Ausführliche Statistiken für Tag (Stundenverlauf), Woche, Monat und Jahr
  - Aktive Gehzeit, Distanz in Kilometern und verbrannte Kalorien
  - Akkusparender Android-Hintergrunddienst (zählt auch bei ausgeschaltetem Display)
  - Akustische Signale (Earcons) und haptisches Vibrationsfeedback
  - Hoher Kontrast: Gelb auf Schwarz, Weiß auf Schwarz und Großschrift
  - 100% offline & datenschutzfreundlich

