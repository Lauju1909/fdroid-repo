AutoName: VokabelStar
Summary: Barrierefreier Vokabeltrainer wie Duolingo fuer Android (TalkBack-optimiert)
Description: |-
  VokabelStar bringt das motivierende Duolingo-Lernprinzip auf Android –
  100% barrierefrei, ohne Schreibzwang und vollstaendig lokal und offline nutzbar.

  Features:
  - Optimiert fuer Screenreader (TalkBack, NVDA/JAWS-kompatible Bedienmuster)
  - Duolingo-Gamification: Tages-Streaks, XP, Herzen und Level-System
  - Echte Sprachausgabe ueber Android Text-to-Speech
  - 6 verschiedene interaktive Uebungsmodi ohne Tastatur-Tippen
  - Universal-Import fuer eigene Vokabeldateien (Word .docx, Excel .xlsx, CSV, TXT)
  - Hoher Kontrastmodus (Gelb auf Schwarz) fuer Sehbehinderte
  - 100% Offline & Privat – keine Tracker, kein Cloud-Zwang

RepoType: git
Repo: https://github.com/Lauju1909/VokabelStar-Android.git

