Name: VokabelStar
AutoName: VokabelStar
Summary: Barrierefreier Vokabeltrainer wie Duolingo für Android (TalkBack-optimiert)
Categories:
  - Education
License: MIT
AuthorName: Lauju1909
SourceCode: https://github.com/Lauju1909/VokabelStar-Android
IssueTracker: https://github.com/Lauju1909/VokabelStar-Android/issues
Description: |-
  VokabelStar bringt das motivierende Duolingo-Lernprinzip auf Android –
  100% barrierefrei, ohne Schreibzwang und vollständig lokal und offline nutzbar.

  Features:
  - Optimiert für Screenreader (TalkBack, NVDA/JAWS-kompatible Bedienmuster)
  - Duolingo-Gamification: Tages-Streaks, XP, Herzen und Level-System
  - Echte Sprachausgabe über Android Text-to-Speech
  - 6 verschiedene interaktive Übungsmodi ohne Tastatur-Tippen
  - Universal-Import für eigene Vokabeldateien (Word .docx, Excel .xlsx, CSV, TXT)
  - Hoher Kontrastmodus (Gelb auf Schwarz) für Sehbehinderte
  - 100% Offline & Privat – keine Tracker, kein Cloud-Zwang
