Name: Dokumenten-Betrachter Barrierefrei
AutoName: Dokumenten-Betrachter Barrierefrei
Summary: Barrierefreier Dokumenten-Betrachter für LibreOffice (ODT, ODS), Word (DOCX), PDF und Text mit TalkBack-Fokus
Categories:
