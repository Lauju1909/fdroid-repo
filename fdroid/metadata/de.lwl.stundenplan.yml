AutoName: Barrierefreies WebUntis
Summary: Der barrierefreie Stundenplan für WebUntis – optimiert für Schüler mit Sehbeeinträchtigung
Description: |-
  Barrierefreies WebUntis ermöglicht Schülern und Lehrkräften einen schnellen,
  barrierefreien Zugriff auf Stundenpläne, Vertretungen und Schulinformationen.
  Entwickelt am LWL-Berufskolleg Soest.

  Features:
  - Perfekte TalkBack-Integration mit strukturierter Sprachnavigation
  - Schnellauswahl für Tage, Stunden, Fächer, Räume und Lehrkräfte
  - Vertretungsplananzeige mit Ausfällen und Änderungen
  - Offline-Pufferung für den schnellen Abruf auch bei schlechtem Netz
  - Barrierefreie Kontrastmodi

