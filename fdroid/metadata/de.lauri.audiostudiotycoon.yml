AutoName: Audio Studio Tycoon
Summary: Deep game developer tycoon simulation - 100% accessible for blind & visually impaired
Description: |-
  Audio Studio Tycoon is an in-depth game development tycoon simulation
  specifically built for blind, visually impaired, and sighted players alike.

  Features:
  - 100% accessible with full TalkBack and screen reader support
  - Dynamic audio cues, speech synthesis, and tactile feedback
  - Build and manage your video game development studio from 1980 to modern eras
  - Research innovative technologies, custom game engines, and platforms
  - Completely ad-free, tracker-free, and open source

