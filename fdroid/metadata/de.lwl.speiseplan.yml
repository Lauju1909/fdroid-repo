Description: |-
  LWL Speiseplan zeigt ausschließlich die aktuellen Mensa-Speisepläne der
  LWL-Von-Vincke-Schule und des LWL-Berufsbildungswerks Soest an –
  schnell, barrierefrei und komplett ohne Anmeldung.

  Features:
  - Sofortiger Start ohne Login oder Konto
  - Automatische Live-Aktualisierung und Offline-Speicherung
  - Wochenauswahl inkl. automatischer Vorschau auf die kommende Schulwoche am Wochenende
  - Menü-Filter (Vollkost, Muslimisch ohne Schwein, Vegetarisch) und Tagesfilter
  - Integrierte Vorlesefunktion, TalkBack-Optimierung, Kontrastmodi und Allergen-Legende
