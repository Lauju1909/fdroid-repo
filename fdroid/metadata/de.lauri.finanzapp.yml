Description: |-
  Haushaltsbuch Barrierefrei ist eine intuitive und sichere Finanz-App, entwickelt für
  Menschen mit Sehbehinderung, Blindheit und alle, die eine klare barrierefreie Finanzverwaltung schätzen.

  Features:
  - Optimiert für Screenreader (TalkBack, NVDA/JAWS-kompatible Bedienmuster)
  - Hoher Kontrast, anpassbare Schriftgrößen und OLED-Dark-Mode
  - Flexible Abrechnungszeiträume (monatlich, wöchentlich, flexibel)
  - Spartöpfe, Daueraufträge, Wunschlisten
  - Lokaler, verschlüsselter Offline-Tresor ohne Cloud-Zwang
  - Schutz per PIN und Biometrie (Fingerabdruck)
  - Beleg-, Quittungs- und Rechnungserfassung mit OCR
  - Interaktive Einkaufsliste mit WhatsApp-Import/Export
